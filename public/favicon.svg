<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Haru Café logo: a white badge with a brown smiling cup and the shop name -->
  <defs>
    <path id="top" d="M22 60a38 38 0 0 1 76 0" />
    <path id="bottom" d="M23 60a37 37 0 0 0 74 0" />
  </defs>
  <circle cx="60" cy="60" r="58" fill="#ffffff" stroke="#6b3e2a" stroke-width="4" />
  <circle cx="60" cy="60" r="50" fill="none" stroke="#6b3e2a" stroke-width="1.5" />

  <!-- the words -->
  <text font-family="Bricolage Grotesque Variable, Arial Black, sans-serif" font-weight="800" fill="#6b3e2a">
    <textPath href="#top" startOffset="50%" text-anchor="middle" font-size="15" letter-spacing="4">HARU</textPath>
  </text>
  <text font-family="Bricolage Grotesque Variable, Arial Black, sans-serif" font-weight="800" fill="#6b3e2a">
    <textPath href="#bottom" startOffset="50%" text-anchor="middle" font-size="13" letter-spacing="5" dominant-baseline="hanging">CAFÉ</textPath>
  </text>
  <circle cx="20" cy="62" r="2" fill="#6b3e2a" />
  <circle cx="100" cy="62" r="2" fill="#6b3e2a" />

  <!-- steam heart -->
  <path d="M60 46c-4.6-3.3-7-6.1-7-9 0-2.3 1.7-3.9 3.8-3.9 1.4 0 2.5.8 3.2 1.9.7-1.1 1.8-1.9 3.2-1.9 2.1 0 3.8 1.6 3.8 3.9 0 2.9-2.4 5.7-7 9z" fill="#b98361" />
  <!-- handle -->
  <path d="M73.5 55h2.4a5.8 5.8 0 0 1 0 11.6h-3.3" fill="none" stroke="#6b3e2a" stroke-width="3.8" stroke-linecap="round" />
  <!-- cup -->
  <path d="M44 50h30l-2.8 18.8a6.5 6.5 0 0 1-6.4 5.6H53.2a6.5 6.5 0 0 1-6.4-5.6z" fill="#6b3e2a" />
  <rect x="42.5" y="48" width="33" height="4.6" rx="2.3" fill="#4a2a1c" />
  <!-- face -->
  <circle cx="54.5" cy="59.5" r="2" fill="#ffffff" />
  <circle cx="63.5" cy="59.5" r="2" fill="#ffffff" />
  <path d="M56 64q3 2.6 6 0" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
  <!-- saucer -->
  <rect x="41" y="77" width="36" height="3.6" rx="1.8" fill="#4a2a1c" />
</svg>
